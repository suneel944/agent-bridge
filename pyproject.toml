[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Run Claude Code and Codex in isolated worktrees with shared coordination."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp-agent-mail",
  "fastmcp>=2.10.5,<3",
  "psutil>=6.1,<8",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[tool.uv.sources]
mcp-agent-mail = { git = "https://github.com/Dicklesworthstone/mcp_agent_mail.git", rev = "08797e0fe4c167dc4ec2206abba12a6d88baf6a0" }

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1", "mcp>=1.20,<2"]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN001", "ANN201", "ANN202", "PLE", "PLW"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are injected dynamically; descriptive test names are the docs.
"tests/**" = ["D", "ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
testpaths = ["tests"]
