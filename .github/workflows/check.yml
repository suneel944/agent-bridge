name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.scope.outputs.pythons }}
      macos: ${{ steps.scope.outputs.macos }}
      wsl: ${{ steps.scope.outputs.wsl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        name: Choose the legs this change needs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m scripts.ci_scope
  check:
    needs: [changes, python, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed Python check
        env:
          CHANGES: ${{ needs.changes.result }}
          PYTHON: ${{ needs.python.result }}
          MACOS: ${{ needs.macos.result }}
          MACOS_NEEDED: ${{ needs.changes.outputs.macos }}
        run: |
          test "$CHANGES" = success
          test "$PYTHON" = success
          if [ "$MACOS_NEEDED" = false ]; then
            test "$MACOS" = skipped
          else
            test "$MACOS" = success
          fi
  python:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.pythons) }}
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python }}
      - run: make check
  macos:
    name: python (3.12, macos-latest)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'
      - run: make check
  wsl:
    needs: changes
    if: needs.changes.outputs.wsl == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          additional-packages: git python3 curl ca-certificates
      - name: Run the behaviour suite inside the Linux file system
        shell: wsl-bash {0}
        run: |
          set -eu
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cp -r "$PWD" "$HOME/checkout"
          cd "$HOME/checkout"
          uv python install 3.12
          uv sync --locked
          uv build --no-sources
          uv run --locked pytest -q
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/secret-scan
