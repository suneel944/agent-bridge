name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: ./.github/actions/secret-scan
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: make check
      - run: make release-artifacts
      - name: Create draft release with verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Agent Bridge $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            ./*.whl ./*.tar.gz ./*.zip requirements.txt CHANGELOG.md \
            RELEASE_NOTES.md SHA256SUMS
      - name: Verify uploaded bytes and publish
        shell: bash
        run: |
          set -euo pipefail
          verification_dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$verification_dir"
          cmp dist/release/SHA256SUMS "$verification_dir/SHA256SUMS"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --latest
